name: CtoK
options:
  bundleIdPrefix: com.hackerapps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"

targets:
  CtoK:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: C2K
        CFBundleDisplayName: C2K
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIBackgroundModes:
          - audio
          - location
        NSLocationWhenInUseUsageDescription: >
          C2K can track your distance and pace using GPS.
          This is optional — the workout timer works without it.
        ITSAppUsesNonExemptEncryption: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hackerapps.c2k
      SWIFT_VERSION: "5.9"
      DEVELOPMENT_TEAM: ""
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"

  CtoKTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CtoK

schemes:
  CtoK:
    build:
      targets:
        CtoK: all
        CtoKTests: [test]
    test:
      config: Debug
      targets:
        - CtoKTests
