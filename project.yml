name: CtoK
options:
  bundleIdPrefix: com.hackerapps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  # Pinned so the shipped CFBundleLocalizations never depends on XcodeGen deriving
  # it from Localizable.xcstrings. Keep in sync with the String Catalog's languages.
  knownRegions: [Base, en, de, es, fr, gl, pt-BR, ru, tr]

targets:
  CtoK:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: C2K
        CFBundleDisplayName: C2K
        # Version is defined once, in the target's build settings below.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - location
        NSLocationWhenInUseUsageDescription: >
          C2K can track your distance and pace using GPS.
          This is optional — the workout timer works without it.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: CtoK
        PRODUCT_BUNDLE_IDENTIFIER: com.hackerapps.c2k
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 6BRG6VVP3H
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.2.17"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"

  CtoKTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      PRODUCT_NAME: CtoKTests
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CtoK.app/CtoK"
      BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: CtoK

  CtoKUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      PRODUCT_NAME: CtoKUITests
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: CtoK
    dependencies:
      - target: CtoK

schemes:
  # Default scheme — unit tests only. This is what CI runs on every push.
  CtoK:
    build:
      targets:
        CtoK: all
        CtoKTests: [test]
    test:
      config: Debug
      targets:
        - CtoKTests

  # Screenshot walkthrough. Driven by `fastlane snapshot`; kept out of the
  # default scheme so ordinary `xcodebuild test` runs stay fast.
  CtoKUITests:
    build:
      targets:
        CtoK: all
        CtoKUITests: [test]
    test:
      config: Debug
      targets:
        - CtoKUITests
